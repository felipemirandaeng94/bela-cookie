<style>
/* Layout: app de bolso. Cabeçalho fixo, coluna única de até 560px, abas no rodapé, formulários em folhas que sobem de baixo. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --sunken:#F2F2F2; --line:#E2E2E2;
  --ink:#000000; --muted:#595959;
  --accent:#A3203A; --accent-ink:#FFFFFF; --accent-soft:#F7E5E9;
  --cocoa:#262626; --cocoa-soft:#EDEDED;
  --ok:#2B7749; --ok-soft:#E2F1E7; --warn:#93590A; --warn-soft:#FAEED6; --bad:#B42318; --bad-soft:#FBE4E1;
  --scrim:rgba(0,0,0,.45);
  --shadow:0 1px 2px rgba(0,0,0,.06),0 6px 20px rgba(0,0,0,.08);
  --knob:#FFFFFF;
  --f-display:'Gabarito',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px; --tab-h:64px;
  --logo-l:block; --logo-d:none;
}


*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.ic{width:20px;height:20px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Cabeçalho */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
#top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand svg{width:24px;height:24px}
.brand-logo{flex:none;display:block;height:50px}
.brand-logo img{height:50px;width:auto;max-width:none}
.brand-logo .logo-l{display:var(--logo-l)}
.brand-logo .logo-d{display:var(--logo-d)}
.top-title{flex:1;min-width:0}
.top-title small{display:block;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.03em}
.top-title h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.sync{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:700;color:var(--ink);flex:none}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.nuvem i{background:var(--ok)}
.sync.local i{background:var(--warn)}
.sync.busy i{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

main .wrap{padding-block:6px calc(var(--tab-h) + 104px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:12px}
.stack > *{min-width:0}
.sec-title{font-family:var(--f-display);font-size:18px;font-weight:700;margin:10px 2px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-title small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted)}

/* Abas */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.01em}
#tabs button svg{width:23px;height:23px}
#tabs button[aria-current="page"]{color:var(--accent)}

.fab{position:fixed;z-index:24;right:max(max(16px,env(safe-area-inset-right,0px)),calc(50vw - 264px));bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:14px 20px 14px 16px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}

/* Peças */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card p{margin:0}
.callout{background:var(--accent-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.callout h3{margin:0;font-family:var(--f-display);font-size:18px}
.callout p{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 16px;font-weight:700;border:1px solid transparent;font-size:15px;min-height:46px;text-decoration:none;color:var(--ink);background:var(--sunken);text-align:center;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.line{background:var(--surface);border-color:var(--line)}
.btn.okb{background:var(--ok-soft);color:var(--ok)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.armed{background:var(--bad);color:var(--surface)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:7px 10px;font-size:13px;border-radius:10px;gap:4px}
.btn .ic{width:18px;height:18px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-row > *{min-width:0}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips::-webkit-scrollbar{display:none}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.st[aria-pressed="false"]{color:var(--muted)}

.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.3}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.info{background:var(--cocoa-soft);color:var(--cocoa)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.neutral{background:var(--sunken);color:var(--muted)}

.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.money{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Listas */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list > * + *{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;padding:12px 14px;min-width:0}
.item-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left;background:none;border:0;padding:0}
.item-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item-body strong{font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere;line-height:1.35}
.day{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:10px 2px 0;display:flex;justify-content:space-between}

.order{display:flex;flex-direction:column;gap:5px;width:100%;text-align:left;background:none;border:0;padding:12px 14px}
.order-top,.order-main{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.order-top .num{font-size:13px;color:var(--muted)}
.order-main strong{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.order-main .money{font-size:17px}
.order-sub{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.order-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

.ava{width:44px;height:44px;border-radius:12px;flex:none;object-fit:cover;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.ava.round{border-radius:50%;background:var(--cocoa-soft);color:var(--cocoa)}
.qty{display:flex;flex-direction:column;align-items:center;min-width:44px;flex:none}
.qty b{font-family:var(--f-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.qty small{font-size:11px;color:var(--muted);font-weight:600}
.qty.ok b{color:var(--ok)} .qty.warn b{color:var(--warn)} .qty.bad b{color:var(--bad)}

.empty{text-align:center;padding:26px 16px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:30px;height:30px;opacity:.7}
.empty p{margin:0;max-width:30ch}

/* Início */
.hello-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip > div{padding:12px;min-width:0;display:flex;flex-direction:column;gap:2px}
.strip > div + div{border-left:1px solid var(--line)}
.strip span{font-size:12px;color:var(--muted);font-weight:600}
.strip b{font-family:var(--f-display);font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.short{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.short button{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-weight:700;font-size:13px;min-width:0}
.short .ic{width:24px;height:24px;color:var(--accent)}
.recv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--warn-soft);color:var(--ink);border:0;border-radius:var(--r);padding:14px}
.recv .ic{color:var(--warn)}
.recv div{flex:1;min-width:0}
.recv strong{display:block}

/* Caixa */
.balance{display:flex;flex-direction:column;gap:10px}
.balance .big{font-family:var(--f-display);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.balance .label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io > div{border-radius:12px;padding:10px 12px;min-width:0}
.io .in{background:var(--ok-soft);color:var(--ok)} .io .out{background:var(--bad-soft);color:var(--bad)}
.io span{display:block;font-size:12px;font-weight:700}
.io b{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums}
.tabs2{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.tabs2 button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mv-ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.mv-ic.in{background:var(--ok-soft);color:var(--ok)} .mv-ic.out{background:var(--bad-soft);color:var(--bad)}
.v-in{color:var(--ok)} .v-out{color:var(--bad)}

/* Painel */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.2}
.kpi .d{font-size:12px;font-weight:600;color:var(--muted)}
.kpi .d.up{color:var(--ok)} .kpi .d.down{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .bar{fill:var(--accent)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:5px}
.bar-top span:first-child{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-top span:last-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Mais */
.menu-row .ic{color:var(--accent);width:22px;height:22px}
.chev{color:var(--muted);transform:rotate(180deg)}

/* Folhas */
#sheet{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease-out}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding-top:0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:rise .22s ease-out}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;align-items:flex-start;gap:12px;padding:16px 0 12px}
.sheet-head > div{flex:1;min-width:0}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:21px;line-height:1.2}
.sheet-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.opt{display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.opt .ic{width:26px;height:26px;color:var(--accent);margin-top:2px}
.opt b{display:block;font-size:16px;font-family:var(--f-display)}
.opt span{color:var(--muted);font-size:14px}

/* Formulários */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > label,.label{font-size:13px;font-weight:700;color:var(--muted)}
.input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;color:var(--ink)}
.input::placeholder{color:var(--muted);opacity:.75}
input[type="date"].input{-webkit-appearance:none;appearance:none;display:block}
textarea.input{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 > *{min-width:0}
.hint{font-size:12px;color:var(--muted)}
.form-err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600}
.switch input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
.steps{border:1px solid var(--line);border-radius:var(--r);padding:0 12px;background:var(--bg)}
.step-row{display:flex;align-items:center;gap:10px;padding:10px 0}
.step-row + .step-row{border-top:1px solid var(--line)}
.step-info{flex:1;min-width:0}
.step-info strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step-info span{font-size:13px;color:var(--muted)}
.step-info span.low{color:var(--warn);font-weight:600}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;flex:none;background:var(--surface)}
.stepper button{width:42px;height:42px;border:0;background:var(--sunken);font-size:21px;font-weight:700;line-height:1}
.stepper output{min-width:38px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
.stepper .qin{width:54px;height:42px;border:0;border-radius:0;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;font-size:17px;background:var(--surface);color:var(--ink);padding:0;-moz-appearance:textfield;appearance:textfield}.stepper .qin::-webkit-outer-spin-button,.stepper .qin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.stepper .qin:focus{outline:none;background:var(--accent-soft)}.step-row.on .qin{color:var(--accent)}
.step-row.on .stepper{border-color:var(--accent)}
.step-row.on output{color:var(--accent)}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.total-bar{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px 2px;border-top:2px dashed var(--line)}
.total-bar span{font-weight:700;color:var(--muted)}
.total-bar strong{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.picker{border:1px solid var(--line);border-radius:12px;background:var(--surface);max-height:250px;overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--shadow)}
.picker button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;min-height:50px}
.picker button + button{border-top:1px solid var(--line)}
.picker .ava{width:34px;height:34px;font-size:14px}
.pick-empty{padding:12px;color:var(--muted);font-size:14px}
.cli-tag{font-size:12px;font-weight:600;color:var(--muted)}
.cli-tag.ok{color:var(--ok)}
.cli-tag:empty{display:none}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .ava{width:72px;height:72px;border-radius:16px;font-size:26px}
.photo-pick > div{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}

/* Comanda */
.ticket{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-head .num{font-size:22px}
.perf{position:relative;border-top:2px dashed var(--line);margin:6px -14px}
.perf::before,.perf::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:1px solid var(--line)}
.perf::before{left:-10px}.perf::after{right:-10px}
.t-line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.t-line > span:first-child{min-width:0}
.t-line .q{color:var(--muted);font-size:12px;display:block}
.t-line.total{font-size:18px;font-weight:800;font-family:var(--f-display)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts > *{min-width:0}
.acts .full{grid-column:1/-1}

.status-card{display:flex;flex-direction:column;gap:8px}
.status-card .sc-head{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:17px}
.status-card .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.status-card.ok .dot{background:var(--ok)}
.counts{display:flex;flex-wrap:wrap;gap:6px}

#toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 80px);transform:translate(-50%,16px);opacity:0;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);width:max-content;text-align:center;transition:opacity .2s,transform .2s;box-shadow:var(--shadow)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:var(--surface)}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-width:600px){.short{grid-template-columns:repeat(6,1fr)}}
#login{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}#login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;margin:auto}#login .lg-top{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin-bottom:6px}#login .brand-logo,#login .brand-logo img{height:96px}.lg-h{margin:0;font-family:var(--f-display);font-size:24px}.lg-err{color:var(--bad);margin:0;font-size:13px;text-align:center}.lg-err:empty{display:none}#login .btn{margin-top:4px}#login .lg-box{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}#login,#login .lg-h,#login p,#login .field>label,#login .input{color:#000}#login .muted{color:#000}#login .field>label{font-size:14px}#login .input{background:var(--sunken);border-color:var(--line)}#login .input:focus{background:var(--surface)}

const LS_BKP = 'belacookie.ultimoBackup';

const store = { mode:'local', ready:false, db:null, dl:null, reason:'', pending:new Set(), nuvem:'claude', saving:0, queues:new Map(), unsubs:[] };

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } }
function localData() { const raw = lsGet(LS_KEY); if (!raw) return null; try { return JSON.parse(raw); } catch { return null; } }
function loadLocal() {
  const d = localData(); if (!d) return;
  COLS.forEach(c => { S[c] = (d[c] && typeof d[c] === 'object') ? d[c] : {}; });
  S.config = {...DEF_CONFIG, ...(d.config || {})};
}
function snapshotData() { const o = { app:'bela-cookie', versao:1, exportadoEm:new Date().toISOString(), config:S.config }; COLS.forEach(c => o[c] = S[c]); return o; }
function saveLocal() { if (!lsSet(LS_KEY, JSON.stringify(snapshotData()))) toast('Não consegui salvar neste aparelho. Baixe um backup agora.', 'bad'); }
function localCount() { const d = localData(); if (!d) return 0; return COLS.reduce((a, c) => a + Object.keys(d[c] || {}).length, 0); }

const clean = o => { const {id, ...rest} = o; return JSON.parse(JSON.stringify(rest)); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function retry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && (e.code === 'unavailable' || e.code === 'resource_exhausted')) { await sleep(700 + Math.random() * 900); return fn(); }
    throw e;
  }
}
function queueWrite(key, fn) {
  const prev = store.queues.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(() => retry(fn));
  store.queues.set(key, next);
  return next;
}
async function cloudOp(key, fn) {
  store.saving++; renderTop();
  try { await queueWrite(key, fn); }
  catch (e) { cloudFail(e); }
  finally { store.saving = Math.max(0, store.saving - 1); renderTop(); }
}
function put(col, obj) {
  if (!obj.id) obj.id = uid();
  S[col][obj.id] = obj;
  if (store.mode === 'local') { saveLocal(); render(); return obj; }
  render();
  cloudOp(col + '/' + obj.id, () => store.db.collection(col).doc(obj.id).set(clean(obj)));
  return obj;
}
function del(col, id) {
  delete S[col][id];
  if (store.mode === 'local') { saveLocal(); render(); return; }
  render();
  cloudOp(col + '/' + id, () => store.db.collection(col).doc(id).delete());
}
function putConfig(cfg) {
  S.config = {...DEF_CONFIG, ...cfg};
  if (store.mode === 'local') { saveLocal(); render(); return; }
  render();
  cloudOp('config/geral', () => store.db.doc('config/geral').set(clean(S.config)));
}
function cloudFail(e) {
  const code = e && e.code;
  if (['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed'].includes(code)) {
    switchToLocal('Sua conta não tem permissão para salvar na nuvem deste app. Os dados passaram a ser salvos neste aparelho.');
  } else if (code === 'quota_exceeded') {
    toast('A nuvem deste app está cheia. Baixe um backup e apague registros antigos.', 'bad');
  } else {
    toast('Não salvou na nuvem. Confira a internet e tente de novo.', 'bad');
  }
}
function switchToLocal(reason) {
  store.unsubs.forEach(u => { try { u(); } catch {} });
  store.unsubs = []; store.mode = 'local'; store.reason = reason; store.pending.clear();
  const old = localData();
  if (old) COLS.forEach(c => { S[c] = {...(old[c] || {}), ...S[c]}; });
  saveLocal(); render(); toast(reason, 'bad');
}

const SB_LS = { sessao:'belacookie.sb.sessao', cache:'belacookie.sb.cache', fila:'belacookie.sb.fila', falhas:'belacookie.sb.falhas' };
const SB = { sess:null, cache:{}, fila:[], ls:{}, flushing:null, timer:0, online:true, loaded:false, loginP:null, started:false };
const jget = (k, d) => { try { const v = JSON.parse(lsGet(k)); return v == null ? d : v; } catch { return d; } };
const sbErr = (code, msg) => Object.assign(new Error(msg || code), { code });
async function sbHttp(path, o = {}, semToken) {
  const h = { apikey:SB_KEY, ...(o.headers || {}) };
  if (o.body !== undefined) h['Content-Type'] = 'application/json';
  if (!semToken) { const t = await sbToken(); if (t) h.Authorization = 'Bearer ' + t; }
  let r;
  try { r = await fetch(SB_URL + path, { method:o.method || 'GET', headers:h, body:o.body !== undefined ? JSON.stringify(o.body) : undefined }); }
  catch { throw sbErr('unavailable', 'Sem conexão'); }
  if (r.status === 401 && !semToken && !o.retried) { await sbRefresh(); return sbHttp(path, { ...o, retried:true }); }
  if (r.status >= 500 || r.status === 429) throw sbErr('unavailable');
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) throw Object.assign(sbErr(r.status === 401 || r.status === 403 ? 'not_granted' : 'invalid_argument', (j && (j.msg || j.message || j.error_description)) || ('Erro ' + r.status)), { status:r.status });
  return j;
}
function sbSave(j) {
  SB.sess = { access:j.access_token, refresh:j.refresh_token, exp:Math.floor(Date.now() / 1000) + (j.expires_in || 3600), uid:j.user.id, email:j.user.email };
  lsSet(SB_LS.sessao, JSON.stringify(SB.sess));
}
let sbRefreshP = null;
function sbRefresh() {
  if (!SB.sess) return Promise.reject(sbErr('not_granted'));
  if (!sbRefreshP) sbRefreshP = sbHttp('/auth/v1/token?grant_type=refresh_token', { method:'POST', body:{ refresh_token:SB.sess.refresh } }, true)
    .then(sbSave)
    .catch(e => { if (e.code !== 'unavailable') { SB.sess = null; try { localStorage.removeItem(SB_LS.sessao); } catch {} } throw e; })
    .finally(() => { sbRefreshP = null; });
  return sbRefreshP;
}
async function sbToken() {
  if (!SB.sess) throw sbErr('not_granted', 'Sem login');
  if (SB.sess.exp - 60 < Date.now() / 1000) { try { await sbRefresh(); } catch (e) { if (e.code !== 'unavailable') throw e; } }
  return SB.sess && SB.sess.access;
}

function metricas(a, b) {
  const P = Object.values(S.pedidos).filter(p => VALID.has(p.status) && p.data >= a && p.data <= b);
  const fat = sum(P, p => p.total);
  let custo = 0, itens = 0, nProd = 0, semCusto = false;
  const top = {};
  P.forEach(p => {
    if (p.tipo === 'rapida') return;
    nProd++;
    (p.itens || []).forEach(i => {
      const q = Number(i.qtd) || 0;
      const c = Number(i.custo) || Number((S.produtos[i.produtoId] || {}).custo) || 0;
      if (!c) semCusto = true;
      itens += q; custo += q * c;
      const k = i.produtoId || i.nome;
      top[k] = top[k] || { nome:(S.produtos[i.produtoId] || {}).nome || i.nome, qtd:0, valor:0 };
      top[k].qtd += q; top[k].valor += q * (Number(i.preco) || 0);
    });
  });
  const desp = sum(Object.values(S.caixa).filter(c => c.tipo === 'despesa' && c.data >= a && c.data <= b), c => c.valor);
  const receb = sum(recebimentos().filter(r => r.data >= a && r.data <= b), r => r.valor) + sum(Object.values(S.caixa).filter(c => c.tipo === 'entrada' && c.data >= a && c.data <= b), c => c.valor);
  const porDia = {};
  P.forEach(p => { porDia[p.data] = (porDia[p.data] || 0) + (Number(p.total) || 0); });
  return { n:P.length, fat, custo, lucro:fat - custo, ticket:P.length ? fat / P.length : 0, ipp:nProd ? itens / nProd : 0, desp, receb, semCusto, top:Object.values(top).sort((x, y) => y.qtd - x.qtd), porDia };
}
function delta(cur, prev) {
  if (!prev) return cur ? '<span class="d up">Sem dados no período anterior</span>' : '<span class="d">Sem vendas nos dois períodos</span>';
  const p = (cur - prev) / prev * 100;
  const s = Math.abs(p) < 0.5 ? 'flat' : p > 0 ? 'up' : 'down';
  return `<span class="d ${s}">${p > 0 ? '+' : ''}${p.toLocaleString('pt-BR', {maximumFractionDigits:0})}% vs período anterior</span>`;
}
function niceMax(v) { if (v <= 0) return 10; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
const shortMoney = v => v >= 1000 ? 'R$ ' + (v / 1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil' : 'R$ ' + Math.round(v);
function barChart(days, vals) {
  const W = 340, H = 160, L = 58, R = 6, T = 10, B = 22;
  const n = days.length, max = niceMax(Math.max(0, ...vals));
  const cw = (W - L - R) / n, bw = Math.max(2, cw * 0.66);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = '';
  [0, max / 2, max].forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="grid"/><text x="${L - 6}" y="${(y(v) + 3.5).toFixed(1)}" text-anchor="end" class="ax">${shortMoney(v)}</text>`; });
  vals.forEach((v, i) => { if (v <= 0) return; const x = L + i * cw + (cw - bw) / 2; g += `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" rx="${Math.min(3, bw / 2).toFixed(1)}" class="bar"><title>${fmtDate(days[i])}: ${money(v)}</title></rect>`; });
  const idx = n <= 7 ? days.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  idx.forEach((i, k) => {
    const x = L + i * cw + cw / 2;
    const anchor = n <= 7 ? 'middle' : k === 0 ? 'start' : k === idx.length - 1 ? 'end' : 'middle';
    const xx = n <= 7 ? x : k === 0 ? L + i * cw : k === idx.length - 1 ? L + (i + 1) * cw : x;
    g += `<text x="${xx.toFixed(1)}" y="${H - 6}" text-anchor="${anchor}" class="ax">${n <= 7 ? WD[parseIso(days[i]).getDay()] : fmtDate(days[i]).slice(0, 5)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Faturamento por dia">${g}</svg>`;
}

  const nd = daysBetween(r[0], r[1]) + 1;

  } else h += empty('cookie', 'Nenhum cookie vendido neste período.');
  return h + '</div>';
};

function cliStats() {

}

let sheetLock = null;
function openSheet(html, mount) {
  sheetRoot.innerHTML = `<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  sheetRoot.hidden = false; document.body.classList.add('locked');
  const s = $('.sheet', sheetRoot); s.scrollTop = 0;
  if (mount) mount(s);
}
function closeSheet() { sheetRoot.hidden = true; sheetRoot.innerHTML = ''; document.body.classList.remove('locked'); sheetLock = null; }
const sheetHead = (t, sub = '') => `<div class="sheet-head"><div><h2>${t}</h2>${sub ? `<p>${sub}</p>` : ''}</div><button type="button" class="iconbtn" data-act="fechar" aria-label="Fechar">${icon('close')}</button></div>`;
function arm(b) {
  if (b.dataset.armed === '1') return true;
  b.dataset.armed = '1'; const old = b.innerHTML;
  b.innerHTML = b.dataset.confirm || 'Toque de novo para confirmar'; b.classList.add('armed');
  setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.innerHTML = old; b.classList.remove('armed'); } }, 4000);
  return false;
}
function segHTML(name, opts, cur) { return `<div class="seg" data-seg="${name}" role="group">${opts.map(o => `<button type="button" class="chip" data-v="${esc(o)}" aria-pressed="${o === cur}">${esc(o)}</button>`).join('')}</div>`; }
function segBind(root, name, onChange) {
  const g = $(`[data-seg="${name}"]`, root); if (!g) return;
  g.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (!b) return; $$('button', g).forEach(x => x.setAttribute('aria-pressed', String(x === b))); onChange(b.dataset.v); });
}
const segVal = (root, name) => { const b = $(`[data-seg="${name}"] [aria-pressed="true"]`, root); return b ? b.dataset.v : ''; };
const showErr = (root, msg) => { const e = $('.form-err', root); if (e) { e.textContent = msg; e.hidden = false; e.scrollIntoView({block:'nearest'}); } };
const digits = v => String(v || '').replace(/\D/g, '');
const porNome = nome => { const n = norm(nome); return Object.values(S.clientes).filter(c => norm(c.nome) === n); };
const mesmoTel = (a, b) => { const x = digits(a), y = digits(b); return !!x && !!y && x.slice(-8) === y.slice(-8); };

function sheetNovo() {
  openSheet(sheetHead('Registrar venda') + `<div class="stack">
    <button class="opt" data-act="novo-ped" data-tipo="produtos">${icon('ticket')}<span><b>Venda de produtos</b><span>Escolha os cookies, as quantidades e a data de entrega.</span></span></button>
    <button class="opt" data-act="novo-ped" data-tipo="rapida">${icon('bolt')}<span><b>Venda rápida</b><span>Só o valor e uma descrição. Bom para vendas no balcão.</span></span></button>
    <button class="opt" data-act="novo-ped" data-tipo="produtos" data-orc="1">${icon('doc')}<span><b>Orçamento</b><span>Monte o pedido sem baixar estoque. Vira pedido quando o cliente fechar.</span></span></button>
  </div>`);
}

function sheetPedForm(opts) {
  const ed = opts.ped ? JSON.parse(JSON.stringify(opts.ped)) : null;
  const tipo = ed ? (ed.tipo || 'produtos') : (opts.tipo || 'produtos');
  const orc = ed ? ed.status === 'orcamento' : !!opts.orc;
  const F = ed || { tipo, data:today(), entrega:'', clienteNome:'', clienteId:'', itens:[], desconto:0, taxa:0, forma:'Pix', pago:tipo === 'rapida', status:orc ? 'orcamento' : (tipo === 'rapida' ? 'entregue' : 'pendente'), obs:'', descricao:'', valor:0 };
  if (opts.clienteId && S.clientes[opts.clienteId]) { F.clienteId = opts.clienteId; F.clienteNome = S.clientes[opts.clienteId].nome; }
  const q = {}, oldPrice = {};
  (F.itens || []).forEach(i => { q[i.produtoId] = (q[i.produtoId] || 0) + (Number(i.qtd) || 0); oldPrice[i.produtoId] = i; });
  const own = {...q};
  const disp = dispMap();
  const prods = listaProdutos().filter(p => p.ativo !== false || q[p.id]);
  const cli = F.clienteId ? S.clientes[F.clienteId] : null;
  let sel = cli ? cli.id : '';
  const title = ed ? `Editar ${orc ? 'orçamento' : 'pedido'}` : (orc ? 'Novo orçamento' : tipo === 'rapida' ? 'Venda rápida' : 'Novo pedido');
  const priceOf = pid => oldPrice[pid] ? Number(oldPrice[pid].preco) || 0 : Number((S.produtos[pid] || {}).preco) || 0;
  const dispOf = pid => (disp[pid] || 0) + (own[pid] || 0);
  const stepRow = p => { const n = q[p.id] || 0, d = dispOf(p.id); return `<div class="step-row ${n ? 'on' : ''}" data-pid="${esc(p.id)}"><div class="step-info"><strong>${esc(p.nome)}</strong><span class="${n > d ? 'low' : ''}">${money(priceOf(p.id))} · ${n > d ? `só ${Math.max(0, d)} em estoque` : `${d} disp.`}</span></div><div class="stepper"><button type="button" data-d="-1" aria-label="Menos ${esc(p.nome)}">−</button><input class="qin" type="number" inputmode="numeric" min="0" step="1" value="${n}" aria-label="Quantidade de ${esc(p.nome)}"><button type="button" data-d="1" aria-label="Mais ${esc(p.nome)}">+</button></div></div>`; };

  let h = sheetHead(ed ? `${title} ${nfmt(F.num)}` : title, tipo === 'rapida' ? 'Use a calculadora do valor e pronto.' : orc ? 'Não baixa estoque até virar pedido.' : '');
  h += `<form id="pf" class="stack" novalidate><div class="form-err" hidden></div>`;
  h += `<div class="field"><label for="pf-cli">Cliente${tipo === 'rapida' ? ' (opcional)' : ''}</label><input class="input" id="pf-cli" autocomplete="off" autocapitalize="words" placeholder="Toque para escolher ou digite um nome novo" value="${esc(F.clienteNome)}" role="combobox" aria-expanded="false" aria-controls="pf-pick"><div class="picker" id="pf-pick" role="listbox" hidden></div><span class="cli-tag" id="pf-tag"></span></div>`;
  h += `<div class="field"><label for="pf-tel">WhatsApp do cliente</label><input class="input" id="pf-tel" inputmode="tel" autocomplete="off" placeholder="(21) 99999-9999" value="${esc(cli ? cli.telefone || '' : '')}"></div>`;
  if (tipo === 'rapida') {
    h += `<div class="field"><label for="pf-desc">Descrição</label><input class="input" id="pf-desc" placeholder="Ex.: 3 cookies no balcão" value="${esc(F.descricao)}"></div>`;
    h += `<div class="field"><label for="pf-valor">Valor (R$)</label><input class="input" id="pf-valor" inputmode="decimal" placeholder="0,00" value="${moneyField(F.valor || F.total)}"></div>`;
  } else {
    h += `<div class="field"><span class="label">Cookies</span>${prods.length ? `<div class="steps" id="pf-itens">${prods.map(stepRow).join('')}</div>` : `<div class="callout"><p>Você ainda não tem produtos cadastrados.</p><button type="button" class="btn line" data-act="nav" data-v="produtos">Cadastrar produtos</button></div>`}</div>`;
  }
  h += `<div class="grid2"><div class="field"><label for="pf-data">${orc ? 'Data do orçamento' : 'Data do pedido'}</label><input class="input" id="pf-data" type="date" value="${esc(F.data)}"></div><div class="field"><label for="pf-ent">Entrega</label><input class="input" id="pf-ent" type="date" value="${esc(F.entrega || '')}"></div></div>`;
  if (tipo !== 'rapida') h += `<div class="grid2"><div class="field"><label for="pf-desc-v">Desconto (R$)</label><input class="input" id="pf-desc-v" inputmode="decimal" placeholder="0,00" value="${moneyField(F.desconto)}"></div><div class="field"><label for="pf-taxa">Taxa de entrega (R$)</label><input class="input" id="pf-taxa" inputmode="decimal" placeholder="0,00" value="${moneyField(F.taxa)}"></div></div>`;
  h += `<div class="field"><span class="label">Forma de pagamento</span>${segHTML('forma', FORMAS, F.forma || 'Pix')}</div>`;
  if (!orc) {
    h += `<label class="switch" for="pf-pago"><span>Já recebi o pagamento</span><input type="checkbox" id="pf-pago" ${F.pago ? 'checked' : ''}></label>`;
    h += `<div class="field"><span class="label">Situação</span><div class="seg" data-seg="status" role="group">${['pendente', 'confirmado', 'entregue'].map(s => `<button type="button" class="chip" data-v="${s}" aria-pressed="${F.status === s}">${STATUS[s].label}</button>`).join('')}</div></div>`;
  }
  h += `<div class="field"><label for="pf-obs">Observações</label><textarea class="input" id="pf-obs" rows="2" placeholder="Ex.: embalar para presente, retirar às 15h">${esc(F.obs || '')}</textarea></div>`;
  h += `<div class="total-bar"><span>Total</span><strong id="pf-total">${money(0)}</strong></div>`;
  h += `<button type="submit" class="btn primary block">${icon('check')}${ed ? 'Salvar alterações' : orc ? 'Salvar orçamento' : 'Salvar pedido'}</button></form>`;

  openSheet(h, s => {
    const subtotal = () => tipo === 'rapida' ? toNum($('#pf-valor', s).value) : Object.entries(q).reduce((a, [pid, n]) => a + n * priceOf(pid), 0);
    const upd = () => {
      const st = subtotal();
      const tot = tipo === 'rapida' ? st : Math.max(0, st - toNum($('#pf-desc-v', s).value) + toNum($('#pf-taxa', s).value));
      $('#pf-total', s).textContent = money(tot);
    };
    upd();
    const itens = $('#pf-itens', s);
    if (itens) itens.addEventListener('click', e => {
      const b = e.target.closest('button[data-d]'); if (!b) return;
      const row = b.closest('.step-row'), pid = row.dataset.pid;
      q[pid] = Math.max(0, (q[pid] || 0) + Number(b.dataset.d));
      row.outerHTML = stepRow(S.produtos[pid] || { id:pid, nome:(oldPrice[pid] || {}).nome || '?' });
      upd();
    });
    if (itens) {
      itens.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('qin')) setTimeout(() => { try { e.target.select(); } catch {} }, 0); });
      itens.addEventListener('input', e => {
        const t = e.target; if (!t.classList || !t.classList.contains('qin')) return;
        const row = t.closest('.step-row'), pid = row.dataset.pid;
        const n = Math.min(9999, Math.max(0, parseInt(t.value, 10) || 0)); q[pid] = n;
        const d = dispOf(pid), sp = row.querySelector('.step-info span');
        row.classList.toggle('on', n > 0);
        if (sp) { sp.className = n > d ? 'low' : ''; sp.textContent = `${money(priceOf(pid))} · ${n > d ? `só ${Math.max(0, d)} em estoque` : `${d} disp.`}`; }
        upd();
      });
      itens.addEventListener('change', e => {
        const t = e.target; if (!t.classList || !t.classList.contains('qin')) return;
        t.value = String(Math.min(9999, Math.max(0, parseInt(t.value, 10) || 0)));
      });
    }
    ['#pf-valor', '#pf-desc-v', '#pf-taxa'].forEach(sel => { const el = $(sel, s); if (el) el.addEventListener('input', upd); });
    const cliIn = $('#pf-cli', s), telIn = $('#pf-tel', s), pick = $('#pf-pick', s), tag = $('#pf-tag', s);
    const ult = {};
    Object.values(S.pedidos).forEach(p => { if (p.clienteId && (!ult[p.clienteId] || p.data > ult[p.clienteId])) ult[p.clienteId] = p.data; });
    const updTag = () => {
      const nome = cliIn.value.trim();
      if (sel && S.clientes[sel]) { tag.className = 'cli-tag ok'; const d = digits(S.clientes[sel].telefone); tag.textContent = 'Cliente cadastrado' + (d ? ` · WhatsApp final ${d.slice(-4)}` : ''); return; }
      tag.className = 'cli-tag';
      if (!nome) { tag.textContent = ''; return; }
      const m = porNome(nome);
      if (!m.length && Object.values(S.clientes).some(c => norm(c.nome).includes(norm(nome)))) { tag.textContent = 'Escolha na lista ou continue digitando para cadastrar um cliente novo.'; return; }
      tag.textContent = m.length ? `Já ${m.length > 1 ? 'existem ' + m.length + ' clientes' : 'existe um cliente'} com esse nome. Toque no certo na lista ou informe o WhatsApp para cadastrar outra pessoa.` : 'Cliente novo. Será cadastrado ao salvar o pedido.';
    };
    const drawPick = () => {
      const q = norm(cliIn.value), qd = digits(cliIn.value);
      let L = listaClientes().sort((a, b) => (ult[b.id] || '').localeCompare(ult[a.id] || '') || String(a.nome).localeCompare(String(b.nome), 'pt-BR'));
      if (q) L = L.filter(c => norm(c.nome).includes(q) || (qd.length >= 3 && digits(c.telefone).includes(qd)));
      pick.innerHTML = L.length ? L.slice(0, 50).map(c => `<button type="button" role="option" data-cid="${esc(c.id)}" aria-selected="${c.id === sel}"><span class="ava round" aria-hidden="true">${esc(String(c.nome || '?').charAt(0).toUpperCase())}</span><span class="item-body"><strong>${esc(c.nome)}</strong><span class="sub">${esc(c.telefone || 'Sem WhatsApp')}${ult[c.id] ? ' · último pedido ' + fmtDate(ult[c.id]).slice(0, 5) : ''}</span></span></button>`).join('')
        : `<div class="pick-empty">${q ? 'Nenhum cadastro com esse nome. Ao salvar, vira cliente novo.' : 'Nenhum cliente cadastrado ainda. Digite o nome para cadastrar.'}</div>`;
      pick.hidden = false; cliIn.setAttribute('aria-expanded', 'true');
    };
    const hidePick = () => { pick.hidden = true; cliIn.setAttribute('aria-expanded', 'false'); };
    cliIn.addEventListener('focus', drawPick);
    cliIn.addEventListener('click', () => { if (pick.hidden) drawPick(); });
    cliIn.addEventListener('input', () => { if (sel && (!S.clientes[sel] || norm(cliIn.value) !== norm(S.clientes[sel].nome))) sel = ''; drawPick(); updTag(); });
    cliIn.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== cliIn) hidePick(); }, 200));
    pick.addEventListener('pointerdown', e => e.preventDefault());
    pick.addEventListener('click', e => {
      const b = e.target.closest('[data-cid]'); if (!b) return;
      const c = S.clientes[b.dataset.cid]; if (!c) return;
      sel = c.id; cliIn.value = c.nome; telIn.value = c.telefone || '';
      hidePick(); cliIn.blur(); updTag();
    });
    updTag();
    segBind(s, 'forma', () => {}); segBind(s, 'status', () => {});
    $('#pf', s).addEventListener('submit', e => {
      e.preventDefault();
      const nome = cliIn.value.trim(), tel = telIn.value.trim();
      const data = $('#pf-data', s).value || today();
      let itensArr = [], sub = 0, desconto = 0, taxa = 0, descricao = '', valor = 0;
      if (tipo === 'rapida') {
        valor = round2(toNum($('#pf-valor', s).value)); descricao = $('#pf-desc', s).value.trim();
        if (!(valor > 0)) return showErr(s, 'Informe o valor da venda.');
        sub = valor;
      } else {
        itensArr = Object.entries(q).filter(([, n]) => n > 0).map(([pid, n]) => {
          const pr = S.produtos[pid] || {}, old = oldPrice[pid];
          return { produtoId:pid, nome:old ? old.nome : pr.nome || '?', preco:priceOf(pid), custo:old ? Number(old.custo) || 0 : Number(pr.custo) || 0, qtd:n };
        });
        if (!itensArr.length) return showErr(s, 'Escolha pelo menos um cookie.');
        sub = round2(sum(itensArr, i => i.qtd * i.preco));
        desconto = round2(toNum($('#pf-desc-v', s).value)); taxa = round2(toNum($('#pf-taxa', s).value));
      }
      let clienteId = '';
      if (nome) {
        let c = sel && S.clientes[sel] && norm(S.clientes[sel].nome) === norm(nome) ? S.clientes[sel] : null;
        if (!c) {
          const m = porNome(nome);
          c = digits(tel) ? m.find(x => mesmoTel(x.telefone, tel)) || null : null;
          if (!c && m.length && !digits(tel)) { cliIn.focus(); return showErr(s, `Já existe cliente chamado ${nome}. Toque no nome certo na lista, ou informe o WhatsApp para cadastrar outra pessoa.`); }
          if (!c) c = put('clientes', { id:uid(), nome, telefone:tel, endereco:'', obs:'', criadoEm:Date.now() });
        }
        if (tel && tel !== (c.telefone || '')) c = put('clientes', {...c, telefone:tel});
        clienteId = c.id;
      }
      const pago = orc ? false : $('#pf-pago', s).checked;
      const obj = {
        ...(ed || {}), id:ed ? ed.id : uid(), num:ed ? ed.num : nextNum(), tipo,
        clienteId, clienteNome:nome, itens:itensArr, descricao, valor,
        subtotal:sub, desconto, taxa, total:round2(Math.max(0, sub - desconto + taxa)),
        forma:segVal(s, 'forma') || 'Pix', pago, pagoEm:pago ? (ed && ed.pago && ed.pagoEm ? ed.pagoEm : data) : '',
        status:orc ? 'orcamento' : (segVal(s, 'status') || (ed ? ed.status : 'pendente')),
        data, entrega:$('#pf-ent', s).value || '', obs:$('#pf-obs', s).value.trim(),
        criadoEm:ed ? ed.criadoEm || Date.now() : Date.now(), atualizadoEm:Date.now()
      };
      put('pedidos', obj);
      toast(`${orc ? 'Orçamento' : 'Pedido'} ${nfmt(obj.num)} salvo.`);
      sheetPedVer(obj.id);
    });
  });
}

function textoWhats(p) {
  const c = S.config;
  const L = [`*${c.negocio}* · ${p.status === 'orcamento' ? 'Orçamento' : 'Pedido'} ${nfmt(p.num)}`];
  if (p.clienteNome) L.push(`Cliente: ${p.clienteNome}`);
  if (p.entrega) L.push(`Entrega: ${fmtDay(p.entrega)}`);
  L.push('');
  if (p.tipo === 'rapida') L.push(`${p.descricao || 'Venda'}: ${money(p.total)}`);
  else (p.itens || []).forEach(i => L.push(`${i.qtd}x ${i.nome} · ${money(i.qtd * i.preco)}`));
  L.push('');
  if (p.tipo !== 'rapida' && (p.desconto > 0 || p.taxa > 0)) {
    L.push(`Subtotal: ${money(p.subtotal)}`);
    if (p.desconto > 0) L.push(`Desconto: −${money(p.desconto)}`);
    if (p.taxa > 0) L.push(`Taxa de entrega: ${money(p.taxa)}`);
  }
  L.push(`*Total: ${money(p.total)}*`);
  if (p.status !== 'orcamento') L.push(`Pagamento: ${p.forma || '-'}${p.pago ? ' (pago)' : ' (a receber)'}`);
  if (!p.pago && c.pix) L.push(`Chave Pix: ${c.pix}`);
  if (p.obs) L.push(`Obs.: ${p.obs}`);
  if (c.mensagem) { L.push(''); L.push(c.mensagem); }
  return L.join('\n');
}

function sheetPedVer(id) {
  const p = S.pedidos[id]; if (!p) { closeSheet(); return; }
  loadJsPDF().catch(() => {});
  const cli = p.clienteId ? S.clientes[p.clienteId] : null;
  const tel = cli ? cli.telefone || '' : '';
  const valid = VALID.has(p.status);
  let h = sheetHead(p.status === 'orcamento' ? 'Orçamento' : 'Pedido', `Criado em ${fmtDate(p.data)}`);
  h += `<div class="stack"><div class="ticket">
    <div class="t-head"><span class="num">${nfmt(p.num)}</span>${pill(p.status)}</div>
    <dl class="kv"><dt>Cliente</dt><dd>${esc(nomeCli(p))}</dd>${tel ? `<dt>WhatsApp</dt><dd>${esc(tel)}</dd>` : ''}${p.entrega ? `<dt>Entrega</dt><dd>${esc(entregaTxt(p))} · ${fmtDate(p.entrega)}</dd>` : ''}</dl>
    <div class="perf"></div>
    ${p.tipo === 'rapida' ? `<div class="t-line"><span>${esc(p.descricao || 'Venda rápida')}</span><span class="tnum">${money(p.total)}</span></div>` : (p.itens || []).map(i => `<div class="t-line"><span>${esc(i.nome)}<span class="q">${i.qtd} × ${money(i.preco)}</span></span><span class="tnum">${money(i.qtd * i.preco)}</span></div>`).join('')}
    <div class="perf"></div>
    ${p.tipo !== 'rapida' ? `<div class="t-line"><span>Subtotal</span><span class="tnum">${money(p.subtotal)}</span></div>` : ''}
    ${p.desconto > 0 ? `<div class="t-line"><span>Desconto</span><span class="tnum">− ${money(p.desconto)}</span></div>` : ''}
    ${p.taxa > 0 ? `<div class="t-line"><span>Taxa de entrega</span><span class="tnum">${money(p.taxa)}</span></div>` : ''}
    <div class="t-line total"><span>Total</span><span class="tnum">${money(p.total)}</span></div>
    ${p.status !== 'orcamento' ? `<div class="t-line"><span class="muted">${esc(p.forma || 'Pagamento')}</span>${p.pago ? `<span class="pill ok">Pago em ${fmtDate(p.pagoEm || p.data)}</span>` : (valid ? '<span class="pill bad">A receber</span>' : '<span class="pill neutral">Sem cobrança</span>')}</div>` : ''}
    ${p.obs ? `<p class="small muted" style="margin:4px 0 0">Obs.: ${esc(p.obs)}</p>` : ''}
  </div>`;
  let a = '';
  const sid = esc(p.id);
  if (p.status === 'orcamento') a += `<button class="btn primary full" data-act="ped-converter" data-id="${sid}">${icon('check')}Transformar em pedido</button>`;
  if (p.status === 'pendente') a += `<button class="btn line" data-act="ped-status" data-v="confirmado" data-id="${sid}">${icon('check')}Confirmar</button>`;
  if (p.status === 'pendente' || p.status === 'confirmado') a += `<button class="btn ${p.status === 'confirmado' ? 'primary full' : 'okb'}" data-act="ped-status" data-v="entregue" data-id="${sid}">${icon('box')}Marcar entregue</button>`;
  if (valid && !p.pago) a += `<button class="btn okb full" data-act="ped-pagar" data-id="${sid}">${icon('wallet')}Registrar pagamento</button>`;
  a += `<button class="btn line" data-act="ped-recibo" data-id="${sid}">${icon('share')}Enviar recibo</button>`;
  a += `<a class="btn line" href="${esc(waLink(tel, textoWhats(p)))}" target="_blank" rel="noopener">${icon('chat')}WhatsApp</a>`;
  a += `<button class="btn" data-act="ped-copiar" data-id="${sid}">${icon('copy')}Copiar resumo</button>`;
  a += `<button class="btn" data-act="ped-editar" data-id="${sid}">${icon('edit')}Editar</button>`;
  if (valid && p.pago) a += `<button class="btn" data-act="ped-despagar" data-id="${sid}">Desfazer pagamento</button>`;
  if (p.status === 'entregue') a += `<button class="btn" data-act="ped-status" data-v="confirmado" data-id="${sid}">Voltar para confirmado</button>`;
  if (p.status === 'cancelado') a += `<button class="btn" data-act="ped-status" data-v="pendente" data-id="${sid}">Reabrir pedido</button>`;
  else if (p.status !== 'orcamento') a += `<button class="btn danger" data-act="ped-status" data-v="cancelado" data-id="${sid}" data-confirm="Confirmar cancelamento">Cancelar pedido</button>`;

function compressImage(file, size = 240) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const side = Math.min(img.width, img.height), sx = (img.width - side) / 2, sy = (img.height - side) / 2;
        const c = document.createElement('canvas'); c.width = size; c.height = size;
        c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, size, size);
        res(c.toDataURL('image/jpeg', 0.78));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}

async function importData(d, how, fromLocal) {
  closeSheet();
  if (store.mode === 'local') {
    if (how === 'substituir') COLS.forEach(c => S[c] = {});
    COLS.forEach(c => Object.entries(d[c] || {}).forEach(([id, o]) => { if (validId(id) && o && typeof o === 'object') S[c][id] = {...o, id}; }));
    if (d.config) S.config = {...DEF_CONFIG, ...d.config};
    saveLocal(); render(); toast('Backup restaurado.'); return;
  }
  const ops = [];
  if (d.config) ops.push(['config/geral', () => store.db.doc('config/geral').set(clean({...DEF_CONFIG, ...d.config}))]);
  if (how === 'substituir') COLS.forEach(c => Object.keys(S[c]).forEach(id => { if (!(d[c] || {})[id]) ops.push([c + '/' + id, () => store.db.collection(c).doc(id).delete()]); }));
  COLS.forEach(c => Object.entries(d[c] || {}).forEach(([id, o]) => { if (validId(id) && o && typeof o === 'object') ops.push([c + '/' + id, () => store.db.collection(c).doc(id).set(clean({...o, id}))]); }));
  toast(`Enviando ${ops.length} registros. Mantenha o app aberto.`);
  store.saving++; renderTop();
  let ok = 0, fail = 0;
  for (const [, op] of ops) {
    try { await retry(op); ok++; }
    catch (e) { fail++; if (!ok && e && ['invalid_argument', 'not_granted', 'revoked'].includes(e.code)) { store.saving--; cloudFail(e); return; } }
  }
  store.saving = Math.max(0, store.saving - 1); renderTop();
  if (fromLocal && !fail) { const raw = lsGet(LS_KEY); if (raw && lsSet(LS_KEY + '.enviado', raw)) { try { localStorage.removeItem(LS_KEY); } catch {} } render(); }
  toast(fail ? `Restaurado, mas ${fail} registros falharam. Tente de novo.` : 'Backup restaurado na nuvem.', fail ? 'bad' : '');
}

/* ---------- arquivos ---------- */
async function saveFile(name, data, mime) {
  if (store.dl) {
    try { await store.dl.save({ filename:name, data }); return true; }
    catch (e) { if (e && e.code === 'declined') return false; toast('Não foi possível baixar o arquivo aqui.', 'bad'); return false; }
  }
  if (window.claude) { toast('Baixar arquivos não está disponível nesta visualização. Use Copiar backup.', 'bad'); return false; }
  const blob = data instanceof Blob ? data : new Blob([data], { type:mime });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
async function shareFile(name, data, mime, title) {
  if (!window.claude && navigator.share && navigator.canShare && typeof File === 'function') {
    try {
      const file = new File([data instanceof Blob ? data : new Blob([data], { type:mime })], name, { type:mime });
      if (navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  return saveFile(name, data, mime);
}

  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const dec = v => (Number(v) || 0).toFixed(2).replace('.', ',');
  const rows = [['Numero', 'Data', 'Entrega', 'Cliente', 'Itens', 'Subtotal', 'Desconto', 'Taxa entrega', 'Total', 'Situacao', 'Pago', 'Pago em', 'Forma', 'Obs'].map(q).join(';')];
  L.forEach(p => rows.push([p.num, fmtDate(p.data), fmtDate(p.entrega), p.clienteNome, itensResumo(p), dec(p.subtotal), dec(p.desconto), dec(p.taxa), dec(p.total), (STATUS[p.status] || {}).label, p.pago ? 'Sim' : 'Nao', fmtDate(p.pagoEm), p.forma, p.obs].map(q).join(';')));
  if (await saveFile(`pedidos-bela-cookie-${today()}.csv`, '﻿' + rows.join('\r\n'), 'text/csv')) toast('Planilha pronta.');
}
async function copiar(txt, okMsg) {
  try { await navigator.clipboard.writeText(txt); toast(okMsg || 'Copiado.'); }
  catch {
    openSheet(sheetHead('Copiar texto', 'Toque e segure no texto para selecionar e copiar.') + `<textarea class="input" id="copy-ta" rows="10" readonly>${esc(txt)}</textarea>`, s => { const ta = $('#copy-ta', s); ta.focus(); ta.select(); });
  }
}
let logoCache = null;
function logoParaPdf() {
  if (logoCache) return Promise.resolve(logoCache);
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv = document.createElement('canvas'); cv.width = img.naturalWidth; cv.height = img.naturalHeight;
        const g = cv.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0);
        logoCache = { data:cv.toDataURL('image/jpeg', 0.92), r:img.naturalHeight / img.naturalWidth }; res(logoCache);
      } catch { res(null); }
    };
    img.onerror = () => res(null); img.src = LOGO_L;
  });
}
let jspdfP = null;
function loadJsPDF() {
  if (window.jspdf) return Promise.resolve();
  if (jspdfP) return jspdfP;
  jspdfP = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = () => res(); sc.onerror = () => { jspdfP = null; rej(new Error('jspdf')); };
    document.head.appendChild(sc);
  });
  return jspdfP;
}
async function gerarRecibo(p) {
  if (!p) return;
  toast('Gerando recibo…');
  try { await loadJsPDF(); } catch { toast('Não consegui carregar o gerador de PDF. Confira a internet.', 'bad'); return; }
  const { jsPDF } = window.jspdf;
  const logo = await logoParaPdf();
  const c = S.config, W = 80, M = 6, LW = 40, LH = logo ? LW * logo.r : 0;
  const tx = s => String(s ?? '').replace(/[–—−]/g, '-').replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x00-\xff]/g, '');
  const itens = p.tipo === 'rapida' ? [{ nome:p.descricao || 'Venda', qtd:1, preco:Number(p.total) || 0 }] : (p.itens || []);
  const meas = new jsPDF({ unit:'mm', format:[W, 200] }); meas.setFontSize(9);
  const nameLines = itens.map(i => meas.splitTextToSize(tx(i.nome), 44));
  meas.setFontSize(8.5);
  const endL = c.endereco ? meas.splitTextToSize(tx(c.endereco), W - 2 * M) : [];
  const obsL = p.obs ? meas.splitTextToSize(tx('Obs.: ' + p.obs), W - 2 * M) : [];
  const msgL = c.mensagem ? meas.splitTextToSize(tx(c.mensagem), W - 2 * M) : [];
  const H = 104 + sum(nameLines, l => l.length * 3.8 + 4.4) + endL.length * 3.6 + obsL.length * 3.6 + msgL.length * 3.6 + (c.pix && !p.pago ? 9 : 0) + (p.desconto > 0 ? 4.6 : 0) + (p.taxa > 0 ? 4.6 : 0) + (p.entrega ? 4.6 : 0) + (logo ? LH - 7.5 : 0);
  const doc = new jsPDF({ unit:'mm', format:[W, Math.max(120, H)] });
  let y = 11;
  const ctr = (t, yy) => doc.text(t, W / 2, yy, { align:'center' });
  const row = (l, r, bold) => { doc.setFont('helvetica', bold ? 'bold' : 'normal'); doc.text(tx(l), M, y); doc.text(tx(r), W - M, y, { align:'right' }); y += 4.6; };
  const dash = () => { doc.setLineDashPattern([1, 1], 0); doc.setDrawColor(150); doc.line(M, y, W - M, y); doc.setLineDashPattern([], 0); y += 5; };
  if (logo) { doc.addImage(logo.data, 'JPEG', (W - LW) / 2, 5, LW, LH); y = 5 + LH + 4; }
  else { doc.setFont('helvetica', 'bold'); doc.setFontSize(15); ctr(tx(c.negocio || 'Recibo'), y); y += 5.5; }
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5);
  if (c.telefone) { ctr(tx('WhatsApp ' + c.telefone), y); y += 3.8; }
  if (endL.length) { ctr(endL, y); y += endL.length * 3.6; }
  y += 1.5; dash();
  doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); ctr(p.status === 'orcamento' ? 'ORÇAMENTO' : 'RECIBO DE PEDIDO', y); y += 6;
  doc.setFontSize(9);
  row('Pedido', nfmt(p.num)); row('Data', fmtDate(p.data));
  if (p.entrega) row('Entrega', fmtDate(p.entrega));
  row('Cliente', String(p.clienteNome || '-').slice(0, 32));
  dash();
  itens.forEach((i, k) => {
    const lines = nameLines[k];
    doc.setFont('helvetica', 'bold'); doc.setFontSize(9); doc.text(lines, M, y);
    doc.setFont('helvetica', 'normal'); doc.text(tx(money(i.qtd * i.preco)), W - M, y, { align:'right' });
    y += lines.length * 3.8;
    doc.setFontSize(8); doc.setTextColor(110); doc.text(tx(`${i.qtd} x ${money(i.preco)}`), M, y); doc.setTextColor(0);
    y += 4.4;
  });
  y -= 1; dash(); doc.setFontSize(9);
  if (p.tipo !== 'rapida') row('Subtotal', money(p.subtotal));
  if (p.desconto > 0) row('Desconto', '- ' + money(p.desconto));
  if (p.taxa > 0) row('Taxa de entrega', money(p.taxa));
  doc.setFontSize(12); row('TOTAL', money(p.total), true); y += 1;
  doc.setFontSize(9);
  if (p.status !== 'orcamento') row('Pagamento', p.forma || '-');
  if (p.status !== 'orcamento') row('Situação', p.pago ? `Pago em ${fmtDate(p.pagoEm || p.data)}` : 'A receber');
  if (c.pix && !p.pago) { doc.setFontSize(8.5); doc.text(tx('Chave Pix: ' + c.pix), M, y); y += 4.6; }
  if (obsL.length) { doc.setFontSize(8.5); doc.text(obsL, M, y); y += obsL.length * 3.6 + 1; }
  dash();
  doc.setFontSize(8.5); if (msgL.length) { ctr(msgL, y); y += msgL.length * 3.6 + 1; }
  doc.setFontSize(7); doc.setTextColor(120); ctr('Documento sem valor fiscal', y + 1); doc.setTextColor(0);
  const ok = await shareFile(`recibo-${String(p.num).padStart(4, '0')}.pdf`, doc.output('blob'), 'application/pdf', `Recibo ${nfmt(p.num)}`);
  if (ok) toast('Recibo pronto.');
}

function seed() {
  if (Object.keys(S.produtos).length) return;
  CARDAPIO.forEach(([nome, preco], i) => put('produtos', { id:'p' + uid() + i, nome, preco, custo:0, estoqueMin:0, ativo:true, foto:'', criadoEm:Date.now() + i }));
  toast('Cardápio adicionado. Ajuste preços e custos em Produtos.');
}

  'cx-tab':b => { UI.cxTab = b.dataset.v; render(); },

  novo:() => sheetNovo(),

  'ped-ver':b => sheetPedVer(b.dataset.id),

  'ped-pagar':b => pagar(b.dataset.id, true, b.dataset.inline === '1'),

  'ped-recibo':b => gerarRecibo(S.pedidos[b.dataset.id]),
  'ped-copiar':b => { const p = S.pedidos[b.dataset.id]; if (p) copiar(textoWhats(p), 'Resumo copiado. Cole no WhatsApp.'); },
  'ped-editar':b => { const p = S.pedidos[b.dataset.id]; if (p) sheetPedForm({ ped:p }); },

  'cx-novo':b => sheetCxForm(b.dataset.tipo),

  'cx-del':b => { if (!arm(b)) return; del('caixa', b.dataset.id); closeSheet(); toast('Lançamento excluído.'); },
  'est-ver':b => sheetEstVer(b.dataset.id),
  'est-mov':b => sheetMov(b.dataset.id, b.dataset.m, b.dataset.back === '1'),
  'mov-del':b => { if (!arm(b)) return; del('estoque', b.dataset.id); sheetEstVer(b.dataset.pid); },
  'prod-novo':() => sheetProdForm(),
  'prod-edit':b => sheetProdForm(S.produtos[b.dataset.id]),
  'prod-del':b => { if (!arm(b)) return; const id = b.dataset.id; Object.values(S.estoque).filter(m => m.produtoId === id).forEach(m => del('estoque', m.id)); del('produtos', id); closeSheet(); toast('Produto excluído.'); },
  'cli-novo':() => sheetCliForm(),
  'cli-ver':b => sheetCliVer(b.dataset.id),
  'cli-edit':b => sheetCliForm(S.clientes[b.dataset.id]),
  'cli-copy':b => { const c = S.clientes[b.dataset.id]; if (c) copiar(c.telefone, 'Número copiado.'); },
  'cli-del':b => { if (!arm(b)) return; del('clientes', b.dataset.id); closeSheet(); toast('Cliente excluído. Os pedidos dele continuam no histórico.'); },
  seed:() => seed(),
  sair:b => { if (!arm(b)) return; if (SB.fila.length) return toast('Há alterações ainda não enviadas. Conecte à internet antes de sair.', 'bad'); [SB_LS.sessao, SB_LS.cache, SB_LS.fila].forEach(k => { try { localStorage.removeItem(k); } catch {} }); location.reload(); },
  'exp-json':() => exportar(),
  'copy-json':() => { copiar(JSON.stringify(snapshotData()), 'Backup copiado. Cole numa conversa sua no WhatsApp para guardar.'); lsSet(LS_BKP, today()); },
  'exp-csv':() => exportarCSV(),
  'imp-colar':() => { const t = $('#imp-txt'); if (!t || !t.value.trim()) return toast('Cole o texto do backup primeiro.', 'bad'); lerBackup(t.value.trim()); },
  'imp-juntar':() => { if (pendingImport) importData(pendingImport, 'juntar'); },
  'imp-subst':b => { if (!arm(b)) return; if (pendingImport) importData(pendingImport, 'substituir'); },
  migrar:() => { const d = localData(); if (d) importData(d, 'juntar', true); }
};
document.addEventListener('click', e => {
